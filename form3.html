<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

    <form action="" method="" style="
        padding: 30px;
        width: 30%;
        border: 2px solid black;
        background-color: #5080a0;
        font-family: Arial;
        margin-left: 30%
    ">

        <label> Project Name:</label>
        <input type="text" name="name" id="name"><br><br>

        <label>Assigened to</label>>
        <input type="text" name="assign" id="assign"><br><br>


        <label>start date:</label>
        <input type="date" name="sdate" id="sdate"><br><br>
        <label>end date:</label>
        <input type="date" name="edate" id="edate"><br><br>
        <label>priority:</label><br>
        <input type="radio" name="priority" value="High" id="priority"> High
        <input type="radio" name="priority" value="Average" id="priority"> Average
        <input type="radio" name="priority" value="Low" id="priority"> Low
        <br><br>


        <label>Description:</label><br>
        <textarea name="Description" rows="3" cols="15" id=''></textarea><br><br>
        <input type="submit" >
        <input type="reset" >
    </form>

   
</body>
</html>
