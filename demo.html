<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>

    <form action="" method="" style="
        padding: 30px;
        width: 30%;
        border: 2px solid black;
        background-color: #f9f9f9;
        font-family: Arial;
        margin-left: 30%
    ">

        <label>Name:</label><br>
        <input type="text" name="name" id="name"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" id="email"><br><br>


        <label>Phone:</label><br>
        <input type="number" name="phone" id="phone"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="male" id="gender"> Male
        <input type="radio" name="gender" value="female" id="gender"> Female
        <br><br>


        <label>Select Year:</label><br>
        <select name="year">
            <option value="fy">FY</option>
            <option value="sy">SY</option>
            <option value="ty">TY</option>
            <option value="btech">BTECH</option>
        </select>
        <br><br>

        <label>Choose Subject:</label><br>
        <input type="checkbox" name="subject" value="python"> Python<br>
        <input type="checkbox" name="subject" value="java"> Java<br>
        <input type="checkbox" name="subject" value="htmlcss"> HTML/CSS<br><br>

        <label>Address:</label><br>
        <textarea name="address" rows="3" cols="5" id=''></textarea><br><br>
        <label>Choose File:</label><br>
        <input type="file" name="file"><br><br>
        <input type="submit">Submit

    </form>

    <form action="" method="" style="
        padding: 30px;
        width: 30%;
        border: 2px solid black;
        background-color: rgb(89, 161, 89);
        font-family: Arial;
        margin-left: 30%
    ">
        <div style="background-color: rgb(151, 241, 151); padding: 20px; border-radius: 20px;">
            <ol type="1"> step 1:Enter Your Personal Details</ol>
        <label>Name:</label><br>
        <input type="text" name="name" id="name" placeholder="enter name"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" id="email"placeholder="enter email"><br><br>


        <label>Phone:</label><br>
        <input type="number" name="phone" id="phone"placeholder="enter phone number"><br><br>
        </div>


          <div style="background-color: rgb(151, 241, 151); padding: 20px; border-radius: 20px;">
            <ol type="1">Step 2: Delivery Address</ol>
        <label>Address:</label><br>
        <textarea name="address" rows="3" cols="5" id=''></textarea><br><br>

        <label>Post code:</label><br>
        <input type="text" name="Post" id="Post"placeholder="enter Post code"><br><br>


        <label>Country:</label><br>
        <input type="text" name="Country" id="Country"placeholder="enter Country "><br><br>
        </div>

        <div style="background-color: rgb(151, 241, 151); padding: 20px; border-radius: 20px;">
            <ol type="1">Step 3: Card Details</ol>
        <label>Card Type:</label><br>
        <textarea name="address" rows="3" cols="5" id=''></textarea><br><br>

        <label>Card Number:</label><br>
        <input type="text" name="Post" id="Post"placeholder="enter Post code"><br><br>


        <label>Security Code:</label><br>
        <input type="text" name="Country" id="Country"placeholder="enter Country "><br><br>
        <label>Name on Card</label><br>
        <input type="text" name="Country" id="Country"placeholder="Exact name as on the card"><br><br>
        </div>
    </form>
</body>
</html>
